services:
  watchdog:
    build: ./app
    container_name: vps-watchdog
    restart: unless-stopped
    env_file:
      - ./config/watchdog.env
    volumes:
      - ./config:/app/config:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
